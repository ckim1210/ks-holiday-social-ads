</head>
<body>
  <main class="stage">
    <div class="device">
      <div class="screen tt" data-ks-pause-host>
        <div class="media">
          <video data-ks-video="vertical" src="assets/video/placeholder-vertical.mp4?v=5" poster="assets/video/placeholder-vertical.jpg?v=5" width="720" height="1280" autoplay muted loop playsinline></video>
        </div>
        <div class="tt-tap" data-ks-tap-pause></div>
        <div class="pause-indicator"><svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>

        <header class="tt-top text-shadow">

          <svg class="icon" viewBox="0 0 24 24"><circle fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" cx="10.5" cy="10.5" r="6.5"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M20 20l-4.6-4.6"/></svg>
        </header>

        <div class="tt-rail text-shadow">
          <a class="tt-avatar" data-ks-link aria-label="Open Kate Spade profile">
            <div class="ks-avatar"><span>ks</span></div>
            <span class="follow"><svg class="icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M12 5v14M5 12h14"/></svg></span>
          </a>

            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span data-count data-raw="48213">48.2K</span>
          </button>
          <button class="tt-act" aria-label="Comments">
            <svg class="icon" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3C6.48 3 2 6.92 2 11.5c0 2.2 1.03 4.2 2.71 5.69L4 21.5l4.43-2.2c1.12.32 2.32.5 3.57.5 5.52 0 10-3.92 10-8.5S17.52 3 12 3zM7.5 10.25a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5zm4.5 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5zm4.5 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></svg><span>1,204</span>

          <button class="tt-act save" data-ks-toggle aria-label="Save">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6.5 2h11A1.5 1.5 0 0 1 19 3.5V22l-7-4.6L5 22V3.5A1.5 1.5 0 0 1 6.5 2z"/></svg><span data-count data-raw="3981">3,981</span>
          </button>
          <button class="tt-act" aria-label="Share">
            <svg class="icon" viewBox="0 0 24 24"><path d="M13.5 4.2v4.6C6.9 9.3 3.6 13.9 3 20.2c2.1-3.6 5.6-5.2 10.5-5.2v4.8l8.3-7.8-8.3-7.8z"/></svg><span>2,310</span>
          </button>
          <a class="tt-disc" data-ks-link aria-label="Promoted music"><div class="ks-avatar"><span>ks</span></div></a>
        </div>

        <div class="tt-info text-shadow">
          <a class="tt-name" data-ks-link><span data-ks-text="brand.handle">katespadeny</span></a>
          <a data-ks-link><p class="tt-caption" data-ks-caption></p></a>
          <div class="tt-sponsored"><span>Sponsored</span></div>
          <div class="tt-music">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
            <div class="marquee"><span data-ks-text="copy.music"></span><span data-ks-text="copy.music"></span></div>
          </div>
          <a class="tt-cta" data-ks-link data-ks-cta-delay="3">
            <span data-ks-text="copy.cta">Shop now</span>
            <svg class="icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M9 5.5l6.5 6.5L9 18.5"/></svg>
          </a>
        </div>

        <div class="tt-progress"><i data-ks-progress></i></div>

        <nav class="tt-nav">
          <span class="is-active"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2.8l9.5 8.3h-2.8v9.6h-5.2v-6.2h-3v6.2H5.3v-9.6H2.5z"/></svg>Home</span>
          <span><svg class="icon" viewBox="0 0 24 24"><circle fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="9" cy="8" r="3.5"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2 .8 3.2 2.9 3.5 5.6"/></svg>Friends</span>
          <span class="tt-create"><b><svg class="icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M12 5v14M5 12h14"/></svg></b></span>
          <span class="tt-inbox"><svg class="icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 5.5h16v11H10l-5 3.5v-3.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8.5 11h7"/></svg>Inbox<em>9</em></span>
          <span><svg class="icon" viewBox="0 0 24 24"><circle fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="8" r="4"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></svg>Profile</span>
        </nav>
      </div>
    </div>
  </main>

  <script src="config.js?v=5"></script>
  <script src="assets/js/app.js?v=7"></script>
